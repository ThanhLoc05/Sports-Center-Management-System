
  spring:
    datasource:
      url: jdbc:sqlserver://localhost:1433;databaseName=SportsCenterDB;encrypt=true;trustServerCertificate=true;
      username: sa
      password: 12345
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    jpa:
      hibernate:
        ddl-auto: validate # Dùng 'validate' vì ta đã tạo Schema chuẩn bằng SQL script ở Phần 1
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.SQLServerDialect

  server:
    port: 8080
